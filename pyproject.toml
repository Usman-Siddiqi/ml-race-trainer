[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-race-trainer"
version = "2.0.0"
description = "A reproducible racing simulator and Double DQN learning lab"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.0,<3", "gymnasium>=1.1,<2", "pygame>=2.6,<3"]

[project.optional-dependencies]
cpu = ["torch>=2.8,<3"]
cuda = ["torch>=2.8,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
race-trainer = "race_trainer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["race_trainer"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
